<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moneta – Dasbor Keuangan Pribadi</title>
<meta name="description" content="Catat transaksi, atur anggaran, menabung, dan rencanakan target keuangan. Data tersinkron antar perangkat.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0b1c30',sec:'#006c49',bg:'#f8f9ff',soft:'#eff4ff',mut:'#45464d',line:'#d3e4fe',err:'#ba1a1a',mint:'#6cf8bb'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{background:#f8f9ff;margin:0}.material-symbols-outlined{font-size:20px;vertical-align:middle}::-webkit-scrollbar{display:none}.dark body{background:#0b1220;color:#e6edf7}.dark [class*=bg-white]{background:#131c2e!important}.dark .bg-soft{background:#1b2740}.dark .bg-bg{background:#0f1729}.dark .bg-line{background:#2a3a58}.dark .text-ink{color:#e6edf7}.dark .text-mut{color:#9fb0c9}.dark .bg-ink{background:#e6edf7;color:#0b1220}.dark input,.dark select{color:#e6edf7}.dark .bg-red-100{background:#4a1d1d}</style>
</head><body class="font-sans text-ink antialiased"><div id="app"></div><div id="modal"></div>
<script>
/* ===== KONFIGURASI SUPABASE (isi dua baris ini) ===== */
const SUPABASE_URL=(window.MONETA_CONFIG||{}).SUPABASE_URL||'',SUPABASE_KEY=(window.MONETA_CONFIG||{}).SUPABASE_KEY||'';
const CFG_OK=/^https:\/\//.test(SUPABASE_URL)&&SUPABASE_KEY.length>20,sb=CFG_OK?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const mail=n=>(n.toLowerCase().replace(/[^a-z]+/g,'.').replace(/^\.|\.$/g,'')||'user')+'@moneta.app';
/* ===== Util & Data ===== */
const $=s=>document.querySelector(s),KEY='moneta_v2',now=new Date(),pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>{const x=new Date(y,m,d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOC={IDR:'id-ID',USD:'en-US',EUR:'de-DE',SGD:'en-SG',JPY:'ja-JP'};
const ICON={Makanan:'restaurant',Transportasi:'directions_car',Hunian:'home',Hiburan:'sports_esports',Kesehatan:'fitness_center',Lainnya:'category'};
const card='bg-white rounded-xl p-5 shadow-sm',btn='h-10 px-4 rounded-xl bg-ink text-white font-semibold text-sm inline-flex items-center gap-1.5 hover:opacity-90',btn2='h-10 px-4 rounded-xl bg-soft text-ink font-semibold text-sm inline-flex items-center gap-1.5 hover:bg-line',inp='w-full h-10 px-3 rounded-lg bg-soft focus:outline-none focus:ring-2 focus:ring-sec text-sm';
function seed(){const tx=[];let id=1;const inc=[38.5,36,35,34,33,32],ex=[19.3,18.2,19.5,16.8,18,17.2],sp=[['Makanan',.29],['Transportasi',.09],['Hunian',.39],['Hiburan',.08],['Kesehatan',.04],['Lainnya',.11]];
 for(let m=0;m<6;m++){const cap=m?28:now.getDate();tx.push({id:id++,d:iso(now.getFullYear(),now.getMonth()-m,1),type:'in',cat:'Pendapatan',note:'Gaji & pendapatan lain',amt:inc[m]*1e6});
  sp.forEach(([c,p],k)=>tx.push({id:id++,d:iso(now.getFullYear(),now.getMonth()-m,Math.min(1+k*3,cap)),type:'out',cat:c,note:c==='Hunian'?'Sewa & utilitas':'Pengeluaran '+c.toLowerCase(),amt:Math.round(ex[m]*1e6*p/1000)*1000}))}
 return{user:{name:'Alexandra M.',photo:''},cur:'IDR',open:60000000,rates:{IDR:1,USD:16000,EUR:18500,SGD:12300,JPY:105},rateSrc:'Manual – isi dari BI JISDOR / bank Anda',rateDate:iso(now.getFullYear(),now.getMonth(),now.getDate()),
 tx,budgets:{Makanan:8e6,Transportasi:3e6,Hunian:8e6,Hiburan:4e6,Kesehatan:1.5e6,Lainnya:3e6},
 goals:[{id:1,n:'Dana Darurat 6 Bulan',t:100e6,c:82e6,due:'2026-12'},{id:2,n:'Liburan Jepang',t:40e6,c:26e6,due:'2027-03'},{id:3,n:'DP Apartemen (KPR)',t:200e6,c:84e6,due:'2028-11'}],plans:[],nid:1000}}
let S,view='dashboard',period='month',q='',typeF='all',synced=false,DB=null,DBID=null,cb=null,tab='in',locked=0,fails=0,ME=null,ACC={},USER=null,loaded=false,st=null;
let dark=(()=>{try{const t=localStorage.getItem('moneta_theme');return t?t=='d':matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}})();
const hx=s=>[...s].map(c=>c.charCodeAt(0).toString(16)).join(''),dref=k=>DB&&DB.collection('data/users/'+DBID).doc(k);
async function H(n,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('moneta|'+n+'|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function blank(n){const d=seed();return{...d,tx:[],sv:[],budgets:{},goals:[],plans:[],open:0,user:{name:n,photo:''}}}
function loadUser(n){ME=n;let j=null;try{j=localStorage.getItem('moneta_d_'+n);if(!j&&n=='ADMIN')j=localStorage.getItem(KEY)}catch(e){}try{S=j?JSON.parse(j):(n=='ADMIN'?seed():blank(n))}catch(e){S=n=='ADMIN'?seed():blank(n)}}

let REV=0,INF=0,CH=null,SYNC='Menghubungkan…';
const hm=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),setSync=m=>{SYNC=m;const e=document.getElementById('sy');if(e)e.textContent=m};
function save(){if(!ME||!USER||!loaded)return;try{localStorage.setItem('moneta_d_'+USER.id,JSON.stringify(S))}catch(e){}setSync('Menyimpan…');clearTimeout(st);st=setTimeout(push,500)}
async function push(){st=null;if(!sb||!USER||!loaded)return;INF=REV+1;
 const{data,error}=await sb.from('user_data').update({data:S,rev:REV+1,updated_at:new Date().toISOString()}).eq('user_id',USER.id).eq('rev',REV).select('rev');INF=0;
 if(error){setSync('Gagal menyimpan: '+error.message);info('Gagal menyimpan ke server: '+esc(error.message));return}
 if(data&&data.length){REV=data[0].rev;setSync('Tersinkron '+hm());return}
 await pull(true)}
async function pull(conflict){if(!sb||!USER)return;const{data,error}=await sb.from('user_data').select('data,rev').eq('user_id',USER.id).maybeSingle();
 if(error||!data){setSync('Gagal memuat: '+(error?error.message:'data tidak ditemukan'));return}
 if(data.rev>REV){clearTimeout(st);st=null;S=data.data;REV=data.rev;A.close();render()}
 setSync('Tersinkron '+hm());if(conflict)info('Data akun ini baru saja diubah dari perangkat lain, jadi versi terbaru sudah dimuat. Perubahan terakhir Anda di sini belum tersimpan, silakan ulangi.')}
function listen(){if(CH)sb.removeChannel(CH);CH=sb.channel('ud-'+USER.id).on('postgres_changes',{event:'*',schema:'public',table:'user_data',filter:'user_id=eq.'+USER.id},pl=>{const r=pl.new;if(!r||r.rev===INF||r.rev<=REV)return;if(JSON.stringify(r.data)===JSON.stringify(S)){REV=r.rev;return}clearTimeout(st);st=null;S=r.data;REV=r.rev;A.close();render();setSync('Diperbarui dari perangkat lain '+hm())}).subscribe()}
async function boot(sess){USER=sess.user;ME=String((USER.user_metadata&&USER.user_metadata.name)||USER.email).toUpperCase();loaded=false;
 const{data,error}=await sb.from('user_data').select('data,rev').eq('user_id',USER.id).maybeSingle();
 if(error){ME=null;USER=null;render();info('Gagal memuat dari server: '+esc(error.message)+'. Pastikan SQL setup sudah dijalankan.');return}
 if(data&&data.data){S=data.data;REV=data.rev||0}else{let o=null;try{o=JSON.parse(localStorage.getItem('moneta_d_'+ME))}catch(e){}S=o&&o.tx?o:blank(ME);const r=await sb.from('user_data').insert({user_id:USER.id,data:S,rev:1});if(r.error){ME=null;USER=null;render();info('Gagal membuat data di server: '+esc(r.error.message));return}REV=1}
 loaded=true;synced=true;view='dashboard';setSync('Tersinkron '+hm());listen();render()}
document.addEventListener('visibilitychange',()=>{if(!USER||!loaded)return;if(document.hidden){if(st){clearTimeout(st);push()}}else if(!st)pull(false)});
addEventListener('online',()=>{if(USER&&loaded){if(st){clearTimeout(st);push()}else pull(false)}});

const rate=()=>S.rates[S.cur]||1;
const fmt=n=>new Intl.NumberFormat(LOC[S.cur],{style:'currency',currency:S.cur,maximumFractionDigits:S.cur=='IDR'||S.cur=='JPY'?0:2}).format(n/rate());
const inv=n=>Math.round(n/rate()*100)/100,out=x=>Math.round((parseFloat(x)||0)*rate());
const ts=t=>new Date(t.d+'T00:00:00').getTime(),DAY=864e5;
function range(){const e=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()+DAY;const s={month:new Date(now.getFullYear(),now.getMonth(),1).getTime(),'30':e-30*DAY,q:e-90*DAY,y:e-365*DAY}[period];return[s,e]}
const sum=(type,a,b,cat)=>S.tx.filter(t=>t.type==type&&ts(t)>=a&&ts(t)<b&&(!cat||t.cat==cat)).reduce((x,t)=>x+t.amt,0);
const mRange=m=>[new Date(now.getFullYear(),now.getMonth()-m,1).getTime(),new Date(now.getFullYear(),now.getMonth()-m+1,1).getTime()];
const pct=(a,b)=>b?Math.round((a-b)/b*1000)/10:0;
const bEnd=()=>new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()+DAY,svTotal=()=>(S.sv||[]).reduce((x,e)=>x+(e.type=='dep'?e.amt:-e.amt),0),balance=()=>S.open+sum('in',0,bEnd())-sum('out',0,bEnd())-svTotal(),today=()=>iso(now.getFullYear(),now.getMonth(),now.getDate());
const fdate=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const ic=n=>`<span class="material-symbols-outlined">${n}</span>`;
const avatar=(s=36)=>S.user.photo?`<img src="${S.user.photo}" class="rounded-full object-cover" style="width:${s}px;height:${s}px" alt="Profil">`:`<div class="rounded-full bg-sec text-white flex items-center justify-center font-bold" style="width:${s}px;height:${s}px">${esc((S.user.name||'?')[0].toUpperCase())}</div>`;
/* ===== Modal ===== */
function modal(title,body,fn,label='Simpan'){cb=fn;$('#modal').innerHTML=`<div class="fixed inset-0 z-[60] bg-black/40 flex items-center justify-center p-4" onclick="if(event.target===this)A.close()"><form onsubmit="return A.sub(event)" class="bg-white rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-xl flex flex-col gap-3"><div class="flex justify-between items-center"><h3 class="text-lg font-semibold">${title}</h3><button type="button" onclick="A.close()" aria-label="Tutup">${ic('close')}</button></div>${body}<div class="flex justify-end gap-2 pt-2"><button type="button" class="${btn2}" onclick="A.close()">Batal</button>${fn?`<button class="${btn}">${label}</button>`:''}</div></form></div>`}
const fld=(l,n,v='',t='text',x='')=>`<label class="text-xs font-semibold text-mut flex flex-col gap-1">${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x} class="${inp}"></label>`;
const sel=(l,n,opts,v)=>`<label class="text-xs font-semibold text-mut flex flex-col gap-1">${l}<select name="${n}" class="${inp}">${opts.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select></label>`;
/* ===== Components ===== */
const NAV=[['dashboard','grid_view','Dasbor'],['transactions','receipt_long','Transaksi'],['budgets','pie_chart','Anggaran'],['reports','bar_chart','Laporan'],['savings','savings','Tabungan'],['goals','flag','Target Keuangan'],['settings','settings','Pengaturan']];
function Sidebar(){const on=v=>v==view?'bg-line font-semibold':'text-mut hover:bg-soft';
 return`<aside class="hidden lg:flex fixed left-0 top-0 h-screen w-64 bg-white shadow-sm z-50 flex-col justify-between"><div><button onclick="A.go('dashboard')" class="h-16 px-6 flex items-center gap-2 font-bold text-lg w-full" title="Kembali ke beranda"><span class="w-8 h-8 rounded-lg bg-sec text-white flex items-center justify-center">M</span>Moneta</button><nav class="flex flex-col gap-1 px-4 mt-2">${NAV.map(n=>`<button onclick="A.go('${n[0]}')" class="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm text-left ${on(n[0])}">${ic(n[1])}${n[2]}</button>`).join('')}</nav></div>
 <div class="p-4"><div class="bg-soft rounded-xl p-4 flex flex-col gap-2"><div class="flex justify-between text-sm font-semibold">Rencana Keuangan<span class="text-sec">${ic('verified')}</span></div><p class="text-xs text-mut">${S.plans.length?S.plans.length+' rencana tersimpan.':'Belum ada rencana. Buat rencana harian, bulanan, atau tahunan.'}</p><button onclick="A.plan()" class="text-xs font-bold text-sec text-left hover:underline">Kelola Rencana</button></div></div></aside>`}
function Header(){return`<header class="sticky top-0 z-40 bg-white/90 backdrop-blur shadow-sm px-4 lg:px-8 min-h-16 py-2 flex items-center justify-between gap-3 flex-wrap"><div class="flex items-center gap-2"><button onclick="A.go('dashboard')" class="${btn2}" title="Kembali ke menu awal">${ic('home')}<span class="hidden sm:inline">Beranda</span></button>${view!='dashboard'?`<button onclick="A.go('dashboard')" class="${btn2} hidden md:inline-flex">${ic('arrow_back')}Kembali</button>`:''}</div>
 <div class="flex items-center gap-2"><button onclick="A.theme()" class="${btn2} !px-3" aria-label="Ganti tema">${ic(dark?'light_mode':'dark_mode')}</button><select onchange="A.cur(this.value)" class="h-9 px-3 rounded-full bg-soft text-xs font-semibold" aria-label="Mata uang">${Object.keys(S.rates).map(c=>`<option ${c==S.cur?'selected':''}>${c}</option>`).join('')}</select><button onclick="A.addTx()" class="h-10 px-4 rounded-lg bg-sec text-white text-sm font-semibold flex items-center gap-1">${ic('add')}<span class="hidden sm:inline">Catat Transaksi</span></button><button onclick="A.go('settings')" class="flex items-center gap-2" title="Ubah profil">${avatar(32)}<span class="hidden md:block text-xs font-semibold">${esc(S.user.name)}</span></button><button onclick="A.logout()" class="${btn2} !px-3" title="Keluar" aria-label="Keluar">${ic('logout')}</button></div></header>
 <nav class="lg:hidden flex gap-1 overflow-x-auto px-4 py-2 bg-white">${NAV.map(n=>`<button onclick="A.go('${n[0]}')" class="shrink-0 px-3 py-1.5 rounded-lg text-xs ${n[0]==view?'bg-line font-semibold':'bg-soft'}">${n[2]}</button>`).join('')}<button onclick="A.plan()" class="shrink-0 px-3 py-1.5 rounded-lg text-xs bg-soft">Rencana</button></nav>`}
function Metric(l,v,icn,chg,sub,bar,col='bg-sec',bad=false){return`<div class="${card} flex flex-col gap-2"><div class="flex justify-between"><div><div class="text-xs font-semibold text-mut">${l}</div><div class="text-2xl font-bold tracking-tight mt-1">${v}</div></div><div class="w-10 h-10 rounded-xl bg-soft flex items-center justify-center">${ic(icn)}</div></div>${chg==null?'':`<div class="text-xs"><span class="px-2 py-0.5 rounded-full ${(bad?chg<=0:chg>=0)?'bg-mint':'bg-red-100 text-err'} font-bold">${chg>=0?'+':''}${chg}%</span> <span class="text-mut">${sub}</span></div>`}${bar==null?`<div class="text-xs text-mut">${sub}</div>`:`<div class="h-1.5 bg-line rounded-full overflow-hidden"><div class="${col} h-full" style="width:${Math.max(0,Math.min(100,bar))}%"></div></div>`}</div>`}
function SavingsCard(sur){return`<div class="${card} flex flex-col gap-2"><div class="flex justify-between"><div><div class="text-xs font-semibold text-mut">Tabungan</div><div class="text-2xl font-bold tracking-tight mt-1">${fmt(svTotal())}</div></div><div class="w-10 h-10 rounded-xl bg-soft flex items-center justify-center">${ic('savings')}</div></div><div class="text-xs text-mut">Terpisah dari saldo bersih • Surplus periode: <b class="${sur<0?'text-err':'text-sec'}">${fmt(sur)}</b></div><div class="flex gap-2 mt-auto pt-1"><button onclick="A.sv(1)" class="flex-1 h-9 px-3 rounded-xl bg-sec text-white text-sm font-semibold inline-flex items-center justify-center gap-1">${ic('add')}Menabung</button><button onclick="A.sv(-1)" class="flex-1 ${btn2} !h-9 justify-center">${ic('remove')}Tarik</button></div></div>`}
function CashFlow(){const m=[5,4,3,2,1,0].map(i=>{const[a,b]=mRange(i);return{l:new Date(a).toLocaleDateString('id-ID',{month:'short'}),i:sum('in',a,b),o:sum('out',a,b)}}),mx=Math.max(1,...m.flatMap(x=>[x.i,x.o]))*1.1;
 const bars=m.map((x,k)=>{const X=60+k*85,hi=x.i/mx*190,ho=x.o/mx*190;return`<g><title>${x.l}: masuk ${fmt(x.i)}, keluar ${fmt(x.o)}</title><rect x="${X}" y="${220-ho}" width="16" height="${ho}" rx="3" fill="currentColor" opacity=".85"/><rect x="${X+18}" y="${220-hi}" width="16" height="${hi}" rx="3" fill="#006c49"/><text x="${X+17}" y="236" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${x.l}</text></g>`}).join('');
 const avg=m.reduce((s,x)=>s+x.i-x.o,0)/6;
 return`<div class="${card} lg:col-span-7"><h2 class="font-semibold text-lg">Arus Kas 6 Bulan</h2><p class="text-xs text-mut mb-3">Pemasukan (hijau) vs pengeluaran (gelap) – sentuh batang untuk detail</p><svg viewBox="0 0 600 245" class="w-full text-ink"><line x1="40" x2="580" y1="220" y2="220" stroke="#c6c6cd"/>${bars}</svg><div class="text-xs text-mut pt-2">Rata-rata surplus bulanan: <b class="text-ink">${fmt(avg)}</b></div></div>`}
const TxRow=t=>`<div class="flex items-center justify-between py-2 px-2 rounded-lg hover:bg-bg gap-2"><div class="flex items-center gap-3 min-w-0"><div class="w-9 h-9 rounded-xl ${t.type=='in'?'bg-mint/40 text-sec':'bg-soft'} flex items-center justify-center shrink-0">${ic(t.type=='in'?'payments':ICON[t.cat]||'category')}</div><div class="min-w-0"><div class="text-sm font-semibold truncate">${esc(t.note)}</div><div class="text-xs text-mut">${fdate(t.d)} • ${esc(t.cat)}</div></div></div><div class="flex items-center gap-2 shrink-0"><span class="text-sm font-bold ${t.type=='in'?'text-sec':''}">${t.type=='in'?'+':'-'}${fmt(t.amt)}</span><button onclick="A.addTx(${t.id})" class="text-mut" aria-label="Ubah">${ic('edit')}</button><button onclick="A.delTx(${t.id})" class="text-mut hover:text-err" aria-label="Hapus">${ic('delete')}</button></div></div>`;
const recent=()=>[...S.tx].sort((a,b)=>ts(b)-ts(a)||b.id-a.id);
function BudgetList(edit){const[a,b]=mRange(0);const rows=Object.entries(S.budgets).map(([c,l])=>{const s=sum('out',a,b,c),p=l?Math.round(s/l*100):0,col=p>=90?'bg-err':p>=70?'bg-amber-500':'bg-sec';return`<div><div class="flex justify-between items-center text-sm mb-1 gap-2"><span class="font-semibold flex items-center gap-2">${ic(ICON[c]||'category')}${esc(c)}</span><span class="text-xs text-mut flex items-center gap-2">${fmt(s)} / ${fmt(l)} <b class="${p>=90?'text-err':''}">${p}%</b>${edit?`<button onclick="A.editBud('${esc(c)}')" aria-label="Ubah">${ic('edit')}</button><button onclick="A.delBud('${esc(c)}')" aria-label="Hapus">${ic('delete')}</button>`:''}</span></div><div class="h-2 bg-line rounded-full overflow-hidden"><div class="${col} h-full" style="width:${Math.min(100,p)}%"></div></div></div>`}).join('');return`<div class="flex flex-col gap-4">${rows||'<p class="text-sm text-mut">Belum ada anggaran.</p>'}</div>`}
function GoalCard(g){const p=g.t?Math.min(100,Math.round(g.c/g.t*100)):0;return`<div class="p-3.5 rounded-xl bg-bg flex items-center gap-4"><div class="relative w-16 h-16 shrink-0"><svg viewBox="0 0 36 36" class="w-16 h-16 -rotate-90"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="#d3e4fe" stroke-width="3.5"/><circle cx="18" cy="18" r="15.9155" fill="none" stroke="${p>=100?'#006c49':'#6366f1'}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${p},100"/></svg><span class="absolute inset-0 flex items-center justify-center text-xs font-bold">${p}%</span></div><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${esc(g.n)}</div><div class="text-sm font-semibold">${fmt(g.c)} <span class="text-xs text-mut font-normal">/ ${fmt(g.t)}</span></div><div class="text-xs text-mut">Target: ${esc(g.due||'-')}</div><div class="flex gap-1 mt-1.5 flex-wrap"><button onclick="A.fund(${g.id},1)" class="px-2 py-1 rounded-md bg-mint text-xs font-semibold">+ Tambah</button><button onclick="A.fund(${g.id},-1)" class="px-2 py-1 rounded-md bg-soft text-xs font-semibold">− Kurangi</button><button onclick="A.editGoal(${g.id})" class="px-2 py-1 rounded-md bg-soft text-xs font-semibold">Ubah</button><button onclick="A.delGoal(${g.id})" class="px-2 py-1 rounded-md bg-red-100 text-err text-xs font-semibold">Hapus</button></div></div></div>`}

rmPhoto(){S.user.photo='';save();render()},
dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()},
csv(){A.dl('moneta-transaksi.csv','Tanggal,Jenis,Kategori,Catatan,Jumlah (IDR)\n'+recent().map(t=>[t.d,t.type=='in'?'Masuk':'Keluar',t.cat,'"'+t.note.replace(/"/g,'""')+'"',t.amt].join(',')).join('\n'))},
backup(){A.dl('moneta-cadangan.json',JSON.stringify(S))},
restore(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.tx||!o.rates)throw 0;S=o;save();render()}catch(e){info('Berkas cadangan tidak valid.')}})},
reset(){ask('Hapus SEMUA data akun ini (transaksi, tabungan, anggaran, target, rencana, saldo awal)? Profil, mata uang, dan kurs tetap. Tindakan ini tidak bisa dibatalkan.',()=>{S={...blank(ME),user:S.user,cur:S.cur,rates:S.rates,rateSrc:S.rateSrc,rateDate:S.rateDate};A.commit()},'Hapus Semua')},
plan(){const row=p=>`<div class="flex justify-between items-center bg-bg rounded-lg p-2.5 text-xs gap-2"><div><b>${esc(p.n)}</b> (${{d:'Harian',m:'Bulanan',y:'Tahunan'}[p.per]})<br>Pemasukan ${fmt(p.inc)} • Tetap ${fmt(p.fix)} • Tabung ${p.pc}%<br>Jatah belanja: <b>${fmt(p.spend)}</b> • Tabungan: <b>${fmt(p.sav)}</b> per ${{d:'hari',m:'bulan',y:'tahun'}[p.per]}</div><button type="button" onclick="A.delPlan(${p.id})" aria-label="Hapus">${ic('delete')}</button></div>`;
 modal('Kelola Rencana Keuangan',sel('Periode rencana','per',[['d','Harian'],['m','Bulanan'],['y','Tahunan']],'m')+fld('Nama rencana','n','Rencana saya','text','required')+fld('Perkiraan pemasukan per periode ('+S.cur+')','inc','','number','required min="0" step="any"')+fld('Pengeluaran tetap per periode ('+S.cur+')','fix','0','number','min="0" step="any"')+fld('Target tabungan (% dari pemasukan)','pc','20','number','min="0" max="100"')+`<p class="text-xs text-mut">Setelah disimpan, rencana tampil di bawah beserta jatah belanja dan tabungan per periode.</p>`+(S.plans.length?`<div class="flex flex-col gap-2">${S.plans.map(row).join('')}</div>`:''),f=>{const inc=out(f.inc),fix=out(f.fix),pc=Math.min(100,Math.max(0,+f.pc||0)),sav=Math.round(inc*pc/100);S.plans.push({id:S.nid++,n:f.n,per:f.per,inc,fix,pc,sav,spend:Math.max(0,inc-fix-sav)});A.commit();A.plan()},'Simpan Rencana')},
delPlan(id){S.plans=S.plans.filter(p=>p.id!=id);save();render();A.plan()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')A.close()});
render();
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)boot(data.session)});else A.err('Isi SUPABASE_URL dan SUPABASE_KEY di file config.js.');
</script></body></html>
